<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全部商品 — LUMIÈRE</title>
<meta name="description" content="浏览 LUMIÈRE 全部服饰、包袋、鞋履与配饰。支持品类筛选、价格排序，新加坡直邮东南亚。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <nav class="crumb">
    <a href="index.html">首页</a>
    <span class="sep">/</span>
    <span id="crumb-current">全部商品</span>
  </nav>
</div>

<div class="wrap">
  <div class="shop-layout">

    <!-- 侧栏筛选 -->
    <aside class="filters">
      <div class="filter-group">
        <h4>品类</h4>
        <ul class="filter-list" id="cat-filters"></ul>
      </div>
      <div class="filter-group">
        <h4>价格区间</h4>
        <ul class="filter-list" id="price-filters">
          <li><button data-price="all" class="is-active">全部价格</button></li>
          <li><button data-price="0-50">${Currency.format(0)} – ${Currency.format(50)}</button></li>
          <li><button data-price="50-80">${Currency.format(50)} – ${Currency.format(80)}</button></li>
          <li><button data-price="80-9999">${Currency.format(80)} 以上</button></li>
        </ul>
      </div>
      <div class="filter-group">
        <h4>其他</h4>
        <ul class="filter-list" id="flag-filters">
          <li><button data-flag="sale">仅看特价</button></li>
          <li><button data-flag="new">仅看新品</button></li>
          <li><button data-flag="instock">仅看现货</button></li>
        </ul>
      </div>
    </aside>

    <!-- 商品区 -->
    <main>
      <div class="shop-toolbar">
        <span class="result-count" id="result-count">加载中…</span>
        <select class="sort-select" id="sort-select" aria-label="排序方式">
          <option value="featured">推荐排序</option>
          <option value="price-asc">价格从低到高</option>
          <option value="price-desc">价格从高到低</option>
          <option value="rating">评分最高</option>
          <option value="new">新品优先</option>
        </select>
      </div>

      <div class="grid-products" id="product-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none">
        ${Icons.bag}
        <p>没有符合条件的商品</p>
        <button class="btn btn--ghost btn--sm" style="margin-top:16px" id="reset-filters">清除筛选条件</button>
      </div>
    </main>

  </div>
</div>

<div id="site-footer"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script src="js/currency.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script>
(async function () {
  await initSite({});

  const products = await Store.products();
  const categories = await Store.categories();

  // 筛选状态（支持通过 URL 预置）
  const state = {
    cat: Util.param("cat") || "all",
    price: "all",
    flag: Util.param("flag") || "all",
    sort: Util.param("sort") || "featured",
  };

  // 渲染品类筛选
  const catCounts = {};
  categories.forEach((c) => { catCounts[c.id] = products.filter((p) => p.category === c.id).length; });

  document.getElementById("cat-filters").innerHTML = `
    <li><button data-cat="all" class="${state.cat === "all" ? "is-active" : ""}">全部商品 <span class="count">${products.length}</span></button></li>
    ${categories.map((c) => `
      <li><button data-cat="${c.id}" class="${state.cat === c.id ? "is-active" : ""}">
        ${c.name} <span class="count">${catCounts[c.id]}</span>
      </button></li>
    `).join("")}
  `;

  document.getElementById("sort-select").value = state.sort;

  // 更新面包屑
  function updateCrumb() {
    const c = categories.find((x) => x.id === state.cat);
    document.getElementById("crumb-current").textContent = c ? c.name : "全部商品";
    document.title = (c ? c.name : "全部商品") + " — LUMIÈRE";
  }

  // 应用筛选
  function filtered() {
    let list = [...products];
    if (state.cat !== "all") list = list.filter((p) => p.category === state.cat);
    if (state.price !== "all") {
      const [lo, hi] = state.price.split("-").map(Number);
      list = list.filter((p) => p.price >= lo && p.price < hi);
    }
    if (state.flag === "sale") list = list.filter((p) => Util.discountPct(p.price, p.compareAt) > 0);
    if (state.flag === "new") list = list.filter((p) => p.badge === "新品");
    if (state.flag === "instock") list = list.filter((p) => p.stock > 0);

    const sorters = {
      featured: (a, b) => b.reviews - a.reviews,
      "price-asc": (a, b) => a.price - b.price,
      "price-desc": (a, b) => b.price - a.price,
      rating: (a, b) => b.rating - a.rating,
      new: (a, b) => (b.badge === "新品") - (a.badge === "新品") || b.reviews - a.reviews,
    };
    list.sort(sorters[state.sort] || sorters.featured);
    return list;
  }

  // 渲染
  function render() {
    const list = filtered();
    const grid = document.getElementById("product-grid");
    const empty = document.getElementById("empty-state");
    const countEl = document.getElementById("result-count");

    countEl.textContent = `共 ${list.length} 件商品`;

    if (list.length === 0) {
      grid.innerHTML = "";
      empty.style.display = "block";
    } else {
      empty.style.display = "none";
      grid.innerHTML = list.map(productCardHtml).join("");
    }
    updateCrumb();
  }

  // 事件绑定
  document.getElementById("cat-filters").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cat]");
    if (!btn) return;
    state.cat = btn.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach((b) => b.classList.toggle("is-active", b === btn));
    render();
  });

  document.getElementById("price-filters").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-price]");
    if (!btn) return;
    state.price = btn.dataset.price;
    document.querySelectorAll("[data-price]").forEach((b) => b.classList.toggle("is-active", b === btn));
    render();
  });

  document.getElementById("flag-filters").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-flag]");
    if (!btn) return;
    const v = btn.dataset.flag;
    state.flag = state.flag === v ? "all" : v;
    document.querySelectorAll("[data-flag]").forEach((b) => b.classList.toggle("is-active", b.dataset.flag === state.flag));
    render();
  });

  document.getElementById("sort-select").addEventListener("change", (e) => {
    state.sort = e.target.value;
    render();
  });

  document.getElementById("reset-filters").addEventListener("click", () => {
    state.cat = "all"; state.price = "all"; state.flag = "all";
    document.querySelectorAll("[data-cat]").forEach((b) => b.classList.toggle("is-active", b.dataset.cat === "all"));
    document.querySelectorAll("[data-price]").forEach((b) => b.classList.toggle("is-active", b.dataset.price === "all"));
    document.querySelectorAll("[data-flag]").forEach((b) => b.classList.remove("is-active"));
    render();
  });

  // 货币切换重渲染（价格区间标签也要更新）
  document.addEventListener("currency:change", () => {
    document.querySelector('[data-price="0-50"]').textContent = `${Currency.format(0)} – ${Currency.format(50)}`;
    document.querySelector('[data-price="50-80"]').textContent = `${Currency.format(50)} – ${Currency.format(80)}`;
    document.querySelector('[data-price="80-9999"]').textContent = `${Currency.format(80)} 以上`;
    render();
  });

  render();
})();
</script>
</body>
</html>
