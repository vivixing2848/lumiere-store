<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>结算 — LUMIÈRE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <div class="steps" id="steps">
    <div class="step is-done"><span class="step__num">✓</span><span>购物车</span></div>
    <div class="step__line"></div>
    <div class="step is-active"><span class="step__num">2</span><span>填写信息</span></div>
    <div class="step__line"></div>
    <div class="step"><span class="step__num">3</span><span>完成下单</span></div>
  </div>
</div>

<div class="wrap">
  <div class="checkout" id="checkout">

    <!-- 左：表单 -->
    <form id="checkout-form" novalidate>

      <h3 style="font-size:19px;margin-bottom:20px">1. 收货信息</h3>

      <div class="field-row">
        <div class="field">
          <label for="f-first">名 <span class="req">*</span></label>
          <input type="text" id="f-first" name="firstName" autocomplete="given-name" required>
          <div class="err-msg">请填写名</div>
        </div>
        <div class="field">
          <label for="f-last">姓 <span class="req">*</span></label>
          <input type="text" id="f-last" name="lastName" autocomplete="family-name" required>
          <div class="err-msg">请填写姓</div>
        </div>
      </div>

      <div class="field">
        <label for="f-email">电子邮箱 <span class="req">*</span></label>
        <input type="email" id="f-email" name="email" autocomplete="email" placeholder="用于接收订单确认与物流通知" required>
        <div class="err-msg">请填写有效的邮箱地址</div>
      </div>

      <div class="field">
        <label for="f-phone">手机号码 <span class="req">*</span></label>
        <input type="tel" id="f-phone" name="phone" autocomplete="tel" placeholder="含国家/地区码，如 +65 81234567" required>
        <div class="err-msg">请填写有效手机号（含国家/地区码）</div>
      </div>

      <div class="field">
        <label for="f-country">国家 / 地区 <span class="req">*</span></label>
        <select id="f-country" name="country" required>
          <option value="">请选择</option>
          <option value="SG">新加坡 Singapore</option>
          <option value="MY">马来西亚 Malaysia</option>
          <option value="TH">泰国 Thailand</option>
          <option value="PH">菲律宾 Philippines</option>
          <option value="ID">印度尼西亚 Indonesia</option>
          <option value="VN">越南 Vietnam</option>
        </select>
        <div class="err-msg">请选择国家/地区</div>
      </div>

      <div class="field">
        <label for="f-address">详细地址 <span class="req">*</span></label>
        <input type="text" id="f-address" name="address" autocomplete="street-address" placeholder="街道、门牌号、楼层单元" required>
        <div class="err-msg">请填写详细地址</div>
      </div>

      <div class="field-row--3 field-row" id="addr-extra">
        <div class="field">
          <label for="f-extra1">区域 / 州 <span class="req">*</span></label>
          <input type="text" id="f-extra1" name="region" autocomplete="address-level1" required>
          <div class="err-msg">请填写区域</div>
        </div>
        <div class="field">
          <label for="f-city">城市 <span class="req">*</span></label>
          <input type="text" id="f-city" name="city" autocomplete="address-level2" required>
          <div class="err-msg">请填写城市</div>
        </div>
        <div class="field">
          <label for="f-zip">邮政编码 <span class="req">*</span></label>
          <input type="text" id="f-zip" name="zip" autocomplete="postal-code" required>
          <div class="err-msg">请填写邮编</div>
        </div>
      </div>

      <div class="field">
        <label for="f-note">配送备注（选填）</label>
        <textarea id="f-note" name="note" rows="2" placeholder="如：工作日午后送达、放前台等"></textarea>
      </div>

      <h3 style="font-size:19px;margin:36px 0 8px">2. 配送方式</h3>
      <div id="ship-options"></div>

      <h3 style="font-size:19px;margin:36px 0 8px">3. 支付方式</h3>
      <div id="pay-options"></div>

      <div class="field" id="card-fields" style="display:none;margin-top:16px;padding:20px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-soft)">
        <div class="field">
          <label for="c-number">卡号</label>
          <input type="text" id="c-number" inputmode="numeric" placeholder="4242 4242 4242 4242" autocomplete="cc-number">
        </div>
        <div class="field-row">
          <div class="field" style="margin-bottom:0">
            <label for="c-exp">有效期</label>
            <input type="text" id="c-exp" placeholder="MM / YY" autocomplete="cc-exp">
          </div>
          <div class="field" style="margin-bottom:0">
            <label for="c-cvc">安全码</label>
            <input type="text" id="c-cvc" placeholder="CVC" autocomplete="cc-csc" maxlength="4">
          </div>
        </div>
        <p style="font-size:12px;color:var(--ink-3);margin-top:12px">
          🔒 演示环境不会真实扣款。上线时请接入 Stripe / 2C2P / Xendit 等支付网关。
        </p>
      </div>

      <label class="choice" style="margin-top:24px;align-items:flex-start">
        <input type="checkbox" id="agree" required>
        <span class="choice__body">
          <b style="font-weight:400;font-size:13.5px">我已阅读并同意《服务条款》与《隐私政策》，理解跨境商品清关需提供真实收货信息。</b>
        </span>
      </label>

      <button type="submit" class="btn btn--primary btn--block" style="margin-top:20px;padding:18px" id="submit-btn">
        提交订单 · <span id="pay-total">—</span>
      </button>

      <p style="text-align:center;font-size:12px;color:var(--ink-3);margin-top:14px">
        提交后我们会发送订单确认邮件。任何问题可通过 WhatsApp ${"+65 8123 4567"} 联系。
      </p>
    </form>

    <!-- 右：订单摘要 -->
    <aside class="summary-card">
      <h3>订单摘要</h3>
      <div id="summary-items"></div>

      <div class="promo-row">
        <input type="text" id="promo-input" placeholder="优惠码（试试 WELCOME10）" aria-label="优惠码">
        <button type="button" class="btn btn--ghost btn--sm" id="promo-apply">应用</button>
      </div>
      <p id="promo-msg" style="font-size:12.5px;margin-bottom:12px;display:none"></p>

      <div class="sum-row"><span>商品小计</span><span id="sum-subtotal">—</span></div>
      <div class="sum-row" id="sum-discount-row" style="display:none;color:var(--success)">
        <span>优惠折扣</span><span id="sum-discount">—</span>
      </div>
      <div class="sum-row"><span>运费</span><span id="sum-shipping">—</span></div>
      <div class="sum-row total"><span>应付总额</span><span id="sum-total">—</span></div>

      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);line-height:1.8">
        🔒 支付信息经加密传输<br>
        📦 新加坡仓 1–2 个工作日内出库<br>
        ↩️ 30 天无理由退换
      </div>
    </aside>

  </div>
</div>

<div id="site-footer"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script src="js/currency.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script>
(async function () {
  await initSite({});

  // 空购物车 → 引导页
  if (Cart.isEmpty()) {
    document.getElementById("checkout").innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;padding:96px 16px">
        ${Icons.bag}
        <p style="font-size:16px;color:var(--ink-2);margin-top:12px">购物车是空的，先去挑几件吧</p>
        <a href="shop.html" class="btn btn--primary" style="margin-top:20px">去选购商品</a>
      </div>`;
    document.getElementById("steps").style.display = "none";
    return;
  }

  const state = { shipping: "standard", payment: "card", promo: null };

  /* ---------- 配送方式 ---------- */
  function renderShipping() {
    const sub = Cart.subtotal();
    document.getElementById("ship-options").innerHTML = Shipping.methods.map((m) => {
      const fee = Shipping.fee(m.id, sub);
      return `
        <label class="choice ${state.shipping === m.id ? "is-active" : ""}" data-ship="${m.id}">
          <input type="radio" name="shipping" value="${m.id}" ${state.shipping === m.id ? "checked" : ""}>
          <span class="choice__body">
            <b>${m.name} · ${m.eta}</b>
            <span>${m.note}</span>
          </span>
          <span class="choice__price ${fee === 0 ? "free" : ""}">${fee === 0 ? "免运费" : Currency.format(fee)}</span>
        </label>`;
    }).join("");

    document.querySelectorAll("[data-ship]").forEach((el) => {
      el.addEventListener("click", () => {
        state.shipping = el.dataset.ship;
        document.querySelectorAll("[data-ship]").forEach((x) => x.classList.toggle("is-active", x === el));
        renderSummary();
      });
    });
  }

  /* ---------- 支付方式 ---------- */
  const PAYMENTS = [
    { id: "card",    name: "信用卡 / 借记卡", note: "Visa · Mastercard · JCB", marks: ["VISA", "MC", "JCB"], fee: 0 },
    { id: "ewallet", name: "电子钱包",        note: "GrabPay · ShopeePay · GCash · TrueMoney", marks: ["Grab", "Shopee", "GCash"], fee: 0 },
    { id: "bank",    name: "银行转账 / PayNow", note: "新加坡 PayNow、马来西亚 DuitNow", marks: ["PayNow", "DuitNow"], fee: 0 },
    { id: "cod",     name: "货到付款（COD）",  note: "收到商品当面付款，可能加收手续费", marks: ["COD"], fee: 3 },
  ];

  function renderPayments() {
    document.getElementById("pay-options").innerHTML = PAYMENTS.map((m) => `
      <label class="choice ${state.payment === m.id ? "is-active" : ""}" data-pay="${m.id}">
        <input type="radio" name="payment" value="${m.id}" ${state.payment === m.id ? "checked" : ""}>
        <span class="choice__body">
          <b>${m.name}</b>
          <span>${m.note}</span>
        </span>
        <span class="pay-icons">${m.marks.map((x) => `<span class="pay-mark">${x}</span>`).join("")}</span>
      </label>
    `).join("");

    document.querySelectorAll("[data-pay]").forEach((el) => {
      el.addEventListener("click", () => {
        state.payment = el.dataset.pay;
        document.querySelectorAll("[data-pay]").forEach((x) => x.classList.toggle("is-active", x === el));
        document.getElementById("card-fields").style.display = state.payment === "card" ? "block" : "none";
        renderSummary();
      });
    });
  }

  /* ---------- 金额计算（全部基准货币 SGD） ---------- */
  function totals() {
    const sub = Cart.subtotal();
    const shipFee = Shipping.fee(state.shipping, sub);
    let discount = 0;
    let freeShip = false;

    if (state.promo) {
      discount = Promos.discount(state.promo, sub);
      if (state.promo.type === "freeship") { freeShip = true; discount = 0; }
    }
    const codFee = state.payment === "cod" ? 3 : 0;
    const shipFinal = freeShip ? 0 : shipFee;
    const total = Math.max(0, sub - discount) + shipFinal + codFee;
    return { sub, shipFee: shipFinal, discount, codFee, total };
  }

  /* ---------- 摘要渲染 ---------- */
  function renderSummary() {
    const t = totals();

    document.getElementById("summary-items").innerHTML = Cart.items.map((i) => `
      <div class="summary-line">
        <div class="summary-line__img"><img src="${i.image}" alt="${Util.esc(i.title)}" loading="lazy"></div>
        <div class="summary-line__info">
          <div class="t">${Util.esc(i.title)}</div>
          <div class="v">${Util.esc(i.color)} / ${Util.esc(i.size)} × ${i.qty}</div>
        </div>
        <div class="summary-line__price">${Currency.format(i.price * i.qty)}</div>
      </div>
    `).join("");

    document.getElementById("sum-subtotal").textContent = Currency.format(t.sub);

    const dRow = document.getElementById("sum-discount-row");
    if (t.discount > 0) {
      dRow.style.display = "flex";
      document.getElementById("sum-discount").textContent = "−" + Currency.format(t.discount);
    } else if (state.promo && state.promo.type === "freeship") {
      dRow.style.display = "flex";
      document.getElementById("sum-discount").textContent = "免运费已应用";
    } else {
      dRow.style.display = "none";
    }

    const shipEl = document.getElementById("sum-shipping");
    if (t.shipFee === 0) {
      shipEl.innerHTML = '<span class="free">免运费</span>';
    } else {
      shipEl.textContent = Currency.format(t.shipFee);
    }

    // COD 手续费单列提示
    const codHtml = t.codFee > 0
      ? `<div class="sum-row"><span>货到付款手续费</span><span>${Currency.format(t.codFee)}</span></div>` : "";

    document.querySelector(".sum-row.total").insertAdjacentHTML("beforebegin", codHtml);
    // 清理上一轮重复插入的 COD 行
    const codRows = [...document.querySelectorAll(".sum-row")].filter(
      (r) => r.textContent.includes("货到付款手续费")
    );
    codRows.slice(0, -1).forEach((r) => r.remove());

    document.getElementById("sum-total").textContent = Currency.format(t.total);
    document.getElementById("pay-total").textContent = Currency.format(t.total);
  }

  /* ---------- 优惠码 ---------- */
  document.getElementById("promo-apply").addEventListener("click", () => {
    const input = document.getElementById("promo-input");
    const msg = document.getElementById("promo-msg");
    const res = Promos.apply(input.value, Cart.subtotal());
    msg.style.display = "block";
    if (res.ok) {
      state.promo = res.promo;
      msg.style.color = "var(--success)";
      msg.textContent = `✓ 已应用：${res.promo.label}`;
      input.disabled = true;
      document.getElementById("promo-apply").textContent = "移除";
      document.getElementById("promo-apply").addEventListener("click", removePromo, { once: true });
    } else {
      msg.style.color = "var(--danger)";
      msg.textContent = res.msg;
    }
    renderSummary();
  });

  function removePromo() {
    state.promo = null;
    const input = document.getElementById("promo-input");
    input.disabled = false;
    input.value = "";
    document.getElementById("promo-apply").textContent = "应用";
    document.getElementById("promo-msg").style.display = "none";
    renderSummary();
  }

  /* ---------- 国家/地区 → 地址标签本地化 ---------- */
  const REGION_LABEL = {
    SG: { r: "区域（如 Central）", c: "城市", z: "邮编（6 位）" },
    MY: { r: "州（如 Selangor）", c: "城市", z: "邮编（5 位）" },
    TH: { r: "府（如 Bangkok）", c: "区", z: "邮编（5 位）" },
    PH: { r: "省份（如 Cebu）", c: "城市 / 市镇", z: "邮编（4 位）" },
    ID: { r: "省份（如 DKI Jakarta）", c: "城市 / 区", z: "邮编（5 位）" },
    VN: { r: "省 / 市（如 Hanoi）", c: "区 / 县", z: "邮编（6 位）" },
  };

  document.getElementById("f-country").addEventListener("change", (e) => {
    const lbl = REGION_LABEL[e.target.value] || { r: "区域 / 州", c: "城市", z: "邮政编码" };
    document.querySelector('label[for="f-extra1"]').innerHTML = lbl.r + ' <span class="req">*</span>';
    document.querySelector('label[for="f-city"]').innerHTML = lbl.c + ' <span class="req">*</span>';
    document.querySelector('label[for="f-zip"]').innerHTML = lbl.z + ' <span class="req">*</span>';
  });

  /* ---------- 表单校验 ---------- */
  function validate() {
    let ok = true;
    const rules = [
      { id: "f-first",   test: (v) => v.trim().length > 0 },
      { id: "f-last",    test: (v) => v.trim().length > 0 },
      { id: "f-email",   test: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) },
      { id: "f-phone",   test: (v) => v.replace(/\D/g, "").length >= 8 },
      { id: "f-country", test: (v) => v !== "" },
      { id: "f-address", test: (v) => v.trim().length > 4 },
      { id: "f-extra1",  test: (v) => v.trim().length > 0 },
      { id: "f-city",    test: (v) => v.trim().length > 0 },
      { id: "f-zip",     test: (v) => v.trim().length >= 3 },
    ];

    rules.forEach((r) => {
      const el = document.getElementById(r.id);
      const field = el.closest(".field");
      const pass = r.test(el.value);
      field.classList.toggle("has-error", !pass);
      el.classList.toggle("is-error", !pass);
      if (!pass && ok) {
        el.focus();
        ok = false;
      }
    });

    // 卡字段（仅信用卡支付时校验）
    if (state.payment === "card") {
      const num = document.getElementById("c-number");
      const exp = document.getElementById("c-exp");
      const cvc = document.getElementById("c-cvc");
      if (num.value.replace(/\s/g, "").length < 12 || exp.value.trim() === "" || cvc.value.length < 3) {
        Toast.show("请补全银行卡信息", false);
        ok = false;
      }
    }

    const agree = document.getElementById("agree");
    if (!agree.checked) {
      Toast.show("请先同意服务条款与隐私政策", false);
      ok = false;
    }

    return ok;
  }

  // 输入时清除错误态
  document.querySelectorAll("#checkout-form input, #checkout-form select").forEach((el) => {
    el.addEventListener("input", () => {
      const field = el.closest(".field");
      if (field) { field.classList.remove("has-error"); el.classList.remove("is-error"); }
    });
  });

  /* ---------- 提交 ---------- */
  document.getElementById("checkout-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!validate()) {
      Toast.show("请检查标红的必填项", false);
      return;
    }

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "正在处理…";

    // 模拟下单（真实场景：调用你的支付网关 / 后端 API）
    setTimeout(() => {
      const orderNo = "LM" + Date.now().toString().slice(-8);
      const t = totals();
      const payload = {
        orderNo,
        createdAt: new Date().toISOString(),
        items: Cart.items,
        shippingMethod: state.shipping,
        paymentMethod: state.payment,
        promo: state.promo ? state.promo.label : null,
        totals: t,
        currency: Currency.code,
        customer: {
          firstName: document.getElementById("f-first").value.trim(),
          lastName: document.getElementById("f-last").value.trim(),
          email: document.getElementById("f-email").value.trim(),
          phone: document.getElementById("f-phone").value.trim(),
          country: document.getElementById("f-country").value,
          address: document.getElementById("f-address").value.trim(),
          region: document.getElementById("f-extra1").value.trim(),
          city: document.getElementById("f-city").value.trim(),
          zip: document.getElementById("f-zip").value.trim(),
          note: document.getElementById("f-note").value.trim(),
        },
      };

      try {
        sessionStorage.setItem("lumiere_last_order", JSON.stringify(payload));
      } catch (err) { /* 忽略 */ }

      Cart.clear();
      location.href = "success.html";
    }, 900);
  });

  /* ---------- 初始化 ---------- */
  renderShipping();
  renderPayments();
  renderSummary();

  document.addEventListener("currency:change", () => {
    renderShipping();
    renderPayments();
    renderSummary();
  });
})();
</script>
</body>
</html>
